<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cuts & Setup - Manuel</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:450px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#9333ea;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#f3e8ff;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#9333ea}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#9333ea;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#dcfce7}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#9333ea;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#16a34a}.addr{flex:1;line-height:1.35}.permit{display:inline-block;background:#9333ea;color:#fff;font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px;font-weight:700;font-family:Menlo,Consolas,monospace}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block;line-height:1.4}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{background:#9333ea;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}.marker-pin.start{background:#16a34a}.marker-pin.end{background:#16a34a}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Cuts &amp; Setup - Manuel</h1><p>8 stops - start Wall &amp; St Matthews, end at Shop</p></div><div class="stats"><b>~61 min</b> driving - <b>~40.7 km</b><br><span style="color:#6b7280">Start: Wall &amp; St Matthews -> End: Shop (1279 Loudoun)</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h)</div><div class="btns"><a href="https://www.google.com/maps/dir/49.8904552,-97.1824253/49.9265827,-97.062407/49.9084053,-97.0472001/49.9062565,-97.0517597/49.9096844,-97.0637027/49.8964922,-97.0758015/49.896587,-97.099149/49.840127,-97.254552" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.8904552, "lon": -97.1824253, "addr": "Wall St & St Matthews Ave", "permit": "", "note": "START", "label": "1", "start": true, "end": false}, {"lat": 49.9265827, "lon": -97.062407, "addr": "955 McLeod Ave", "permit": "", "note": "2 sw panels", "label": "2", "start": false, "end": false}, {"lat": 49.9084053, "lon": -97.0472001, "addr": "Peguis St & Devonshire Dr W", "permit": "357347", "note": "1 sw panel", "label": "3", "start": false, "end": false}, {"lat": 49.9062565, "lon": -97.0517597, "addr": "1345 Ravelston Ave W", "permit": "357307", "note": "1 sw panel", "label": "4", "start": false, "end": false}, {"lat": 49.9096844, "lon": -97.0637027, "addr": "885 Molson St", "permit": "", "note": "2 street cuts - quickie saw cut at sidewalk + barricades", "label": "5", "start": false, "end": false}, {"lat": 49.8964922, "lon": -97.0758015, "addr": "500 Panet Rd", "permit": "", "note": "1 cut back of new building", "label": "6", "start": false, "end": false}, {"lat": 49.896587, "lon": -97.099149, "addr": "630 Provencher Blvd", "permit": "", "note": "1 cut back of building", "label": "7", "start": false, "end": false}, {"lat": 49.840127, "lon": -97.254552, "addr": "Shop (1279 Loudoun Rd)", "permit": "", "note": "END - shop", "label": "8", "start": false, "end": true}];const legs=[{"minutes": 19.8, "km": 13.19}, {"minutes": 4.8, "km": 3.19}, {"minutes": 0.8, "km": 0.56}, {"minutes": 2.0, "km": 1.3}, {"minutes": 3.6, "km": 2.37}, {"minutes": 3.5, "km": 2.32}, {"minutes": 26.7, "km": 17.77}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin';if(s.start)cls='marker-pin start';else if(s.end)cls='marker-pin end';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':s.end?'END (Shop)':'Stop '+s.label)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#9333ea',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
