te">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
