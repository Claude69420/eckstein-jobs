document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
