<!DOCTYPE html><html><head><meta charset="utf-8"><title>Asphalt Route</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#18181b;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e4e4e7;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#18181b}.legend{padding:8px 16px;background:#fff;border-bottom:1px solid #d0d4db;font-size:11px;display:flex;gap:14px}.legend .lg{display:flex;align-items:center;gap:6px}.legend .sw{width:14px;height:14px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #999}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db;display:flex;gap:6px;flex-wrap:wrap}.btns a{padding:6px 10px;background:#18181b;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.btns a.alt{background:#6b7280}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}.section{padding:8px 16px;background:#18181b;color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.section.sec{background:#64748b}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.sec-row{background:#f1f5f9}.num{flex:0 0 30px;height:30px;border-radius:15px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 0 0 1px #999}.num.priority{background:#dc2626}.num.secondary{background:#64748b}.num.start{background:#16a34a}.addr{flex:1;line-height:1.35}.permit{display:inline-block;color:#fff;background:#374151;font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px;font-weight:700;font-family:Menlo,Consolas,monospace}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block;line-height:1.4}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}.marker-pin.priority{background:#dc2626}.marker-pin.secondary{background:#64748b}.marker-pin.start{background:#16a34a}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Asphalt Route</h1><p>9 stops - 5 priority + 4 if-time (331 Keewatin dedup'd)</p></div><div class="stats"><b>Priority 5:</b> ~15 min / ~10.2 km &nbsp;|&nbsp; <b>All 9:</b> ~38 min / ~25.3 km</div><div class="legend"><div class="lg"><div class="sw" style="background:#16a34a"></div>Start</div><div class="lg"><div class="sw" style="background:#dc2626"></div>Priority (do first)</div><div class="lg"><div class="sw" style="background:#64748b"></div>If time permits</div></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h)</div><div class="btns"><a href="https://www.google.com/maps/dir/49.931231,-97.164887/49.922088,-97.194688/49.916556,-97.17867/49.901839,-97.1484986/49.893109,-97.151563" target="_blank">Priority 5 in Google Maps</a><a class="alt" href="https://www.google.com/maps/dir/49.931231,-97.164887/49.922088,-97.194688/49.916556,-97.17867/49.901839,-97.1484986/49.893109,-97.151563/49.8801826,-97.147112/49.8533147,-97.1656599/49.821652,-97.196598/49.810866,-97.217082" target="_blank">All 9</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.931231, "lon": -97.164887, "addr": "1119 Mountain Ave", "permit": "337530", "note": "PRIORITY", "label": "S", "start": true, "end": false, "tier": "priority"}, {"lat": 49.922088, "lon": -97.194688, "addr": "331 Keewatin St", "permit": "356625", "note": "PRIORITY", "label": "1", "start": false, "end": false, "tier": "priority"}, {"lat": 49.916556, "lon": -97.17867, "addr": "1313 Logan Ave", "permit": "355212", "note": "PRIORITY", "label": "2", "start": false, "end": false, "tier": "priority"}, {"lat": 49.901839, "lon": -97.1484986, "addr": "470 William Ave", "permit": "351826", "note": "PRIORITY", "label": "3", "start": false, "end": false, "tier": "priority"}, {"lat": 49.893109, "lon": -97.151563, "addr": "447 Webb Pl", "permit": "357289", "note": "PRIORITY", "label": "4", "start": false, "end": false, "tier": "priority"}, {"lat": 49.8801826, "lon": -97.147112, "addr": "Osborne St & Roslyn Rd", "permit": "356942", "note": "if time permits", "label": "5", "start": false, "end": false, "tier": "secondary"}, {"lat": 49.8533147, "lon": -97.1656599, "addr": "1190 Taylor Ave", "permit": "", "note": "if time permits", "label": "6", "start": false, "end": false, "tier": "secondary"}, {"lat": 49.821652, "lon": -97.196598, "addr": "1711 Kenaston Blvd", "permit": "CTR0223", "note": "if time permits - Canadian Tire", "label": "7", "start": false, "end": false, "tier": "secondary"}, {"lat": 49.810866, "lon": -97.217082, "addr": "191 Fleetwood Rd", "permit": "", "note": "if time permits", "label": "8", "start": false, "end": true, "tier": "secondary"}];const legs=[{"minutes": 4.9, "km": 3.28}, {"minutes": 2.7, "km": 1.81}, {"minutes": 5.7, "km": 3.77}, {"minutes": 2.1, "km": 1.38}, {"minutes": 3.1, "km": 2.05}, {"minutes": 6.8, "km": 4.55}, {"minutes": 8.7, "km": 5.78}, {"minutes": 4.0, "km": 2.64}];const nPrio=5;const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin '+(s.start?'start':s.tier);const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':'Stop '+i)+' - '+(s.tier=='priority'?'PRIORITY':'IF TIME')+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});const ll=stops.map(function(s){return [s.lat,s.lon];});for(let i=0;i<ll.length-1;i++){  const isSec=stops[i+1].tier=='secondary';  L.polyline([ll[i],ll[i+1]],{color:isSec?'#64748b':'#dc2626',weight:4,opacity:isSec?0.6:0.8,dashArray:isSec?'4,8':'8,6'}).addTo(map);}map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');let secStarted=false;stops.forEach(function(s,i){  if(i==0){const sec=document.createElement('div');sec.className='section';sec.textContent='Priority - do these first';ol.appendChild(sec);}  if(s.tier=='secondary'&&!secStarted){secStarted=true;const sec=document.createElement('div');sec.className='section sec';sec.textContent='Another day if need be';ol.appendChild(sec);}  const li=document.createElement('li');  if(s.start)li.classList.add('start');else if(s.tier=='secondary')li.classList.add('sec-row');  const cls='num '+(s.start?'start':s.tier);  const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';  const note=s.note?'<div class="note">'+s.note+'</div>':'';  const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';  li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';  li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});  ol.appendChild(li);});</script></body></html>
