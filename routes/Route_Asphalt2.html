<!DOCTYPE html><html><head><meta charset="utf-8"><title>Asphalt Route 2</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#18181b;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e4e4e7;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#18181b}.higg{padding:8px 16px;background:#ede9fe;border-bottom:1px solid #d0d4db;font-size:11px;color:#5b21b6;font-weight:600}.legend{padding:8px 16px;background:#fff;border-bottom:1px solid #d0d4db;font-size:11px;display:flex;gap:14px;flex-wrap:wrap}.legend .lg{display:flex;align-items:center;gap:6px}.legend .sw{width:14px;height:14px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px #999}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#18181b;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}.section{padding:8px 16px;background:#18181b;color:#fff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.section.rest{background:#475569}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}.num{flex:0 0 30px;height:30px;border-radius:15px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 0 0 1px #999}.num.priority{background:#dc2626}.num.rest{background:#475569}.num.optional{background:#7c3aed}.num.start{background:#16a34a}.addr{flex:1;line-height:1.35}.permit{display:inline-block;color:#fff;background:#374151;font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px;font-weight:700;font-family:Menlo,Consolas,monospace}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block;line-height:1.4}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}.marker-pin.priority{background:#dc2626}.marker-pin.rest{background:#475569}.marker-pin.optional{background:#7c3aed}.marker-pin.start{background:#16a34a}.marker-pin.omit{background:#9ca3af;border:2px dashed #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Asphalt Route 2</h1><p>10 stops - 381 Ferry / 975 Elgin / 429 Sherbrook first (any order)</p></div><div class="stats"><b>~55 min</b> driving - <b>~36.7 km</b></div><div class="higg">125 Higgins INCLUDED (+4 min detour, under 10)</div><div class="legend"><div class="lg"><div class="sw" style="background:#16a34a"></div>Start</div><div class="lg"><div class="sw" style="background:#dc2626"></div>Priority 3</div><div class="lg"><div class="sw" style="background:#475569"></div>Rest</div><div class="lg"><div class="sw" style="background:#7c3aed"></div>Higgins (optional)</div></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h)</div><div class="btns"><a href="https://www.google.com/maps/dir/49.887286,-97.2180592/49.891656,-97.158406/49.9091148,-97.1676235/49.932744,-97.170132/49.904133,-97.127104/49.893109,-97.151563/49.879177,-97.14635/49.8533147,-97.1656599/49.821652,-97.196598/49.810866,-97.217082" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.887286, "lon": -97.2180592, "addr": "381 Ferry Rd", "permit": "351387+351386", "note": "PRIORITY", "label": "S", "start": true, "end": false, "tier": "priority"}, {"lat": 49.891656, "lon": -97.158406, "addr": "429 Sherbrook St", "permit": "355195", "note": "PRIORITY", "label": "1", "start": false, "end": false, "tier": "priority"}, {"lat": 49.9091148, "lon": -97.1676235, "addr": "975 Elgin Ave", "permit": "", "note": "PRIORITY", "label": "2", "start": false, "end": false, "tier": "priority"}, {"lat": 49.932744, "lon": -97.170132, "addr": "1247 Mountain Ave", "permit": "356828", "note": "", "label": "3", "start": false, "end": false, "tier": "rest"}, {"lat": 49.904133, "lon": -97.127104, "addr": "125 Higgins Ave", "permit": "355504", "note": "OPTIONAL - omit if >10min detour", "label": "4", "start": false, "end": false, "tier": "optional"}, {"lat": 49.893109, "lon": -97.151563, "addr": "447 Webb Pl", "permit": "357289", "note": "", "label": "5", "start": false, "end": false, "tier": "rest"}, {"lat": 49.879177, "lon": -97.14635, "addr": "Osborne St & River Ave", "permit": "", "note": "", "label": "6", "start": false, "end": false, "tier": "rest"}, {"lat": 49.8533147, "lon": -97.1656599, "addr": "1190 Taylor Ave", "permit": "", "note": "", "label": "7", "start": false, "end": false, "tier": "rest"}, {"lat": 49.821652, "lon": -97.196598, "addr": "1711 Kenaston Blvd", "permit": "CTR0223", "note": "Canadian Tire", "label": "8", "start": false, "end": false, "tier": "rest"}, {"lat": 49.810866, "lon": -97.217082, "addr": "191 Fleetwood Rd", "permit": "", "note": "", "label": "9", "start": false, "end": true, "tier": "rest"}];const legs=[{"minutes": 9.0, "km": 5.98}, {"minutes": 4.3, "km": 2.85}, {"minutes": 5.5, "km": 3.66}, {"minutes": 9.2, "km": 6.16}, {"minutes": 4.5, "km": 2.97}, {"minutes": 3.3, "km": 2.22}, {"minutes": 6.7, "km": 4.44}, {"minutes": 8.7, "km": 5.78}, {"minutes": 4.0, "km": 2.64}];const omit=null;const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin '+(s.start?'start':s.tier);const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':'Stop '+i)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});if(omit){bounds.push([omit.lat,omit.lon]);  const icon=L.divIcon({html:'<div class="marker-pin omit">'+omit.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});  L.marker([omit.lat,omit.lon],{icon:icon}).addTo(map).bindPopup('<b>OMITTED:</b> '+omit.addr+'<br><i>'+omit.note+'</i>');}const ll=stops.map(function(s){return [s.lat,s.lon];});for(let i=0;i<ll.length-1;i++){  const c=stops[i+1].tier=='priority'?'#dc2626':(stops[i+1].tier=='optional'?'#7c3aed':'#475569');  L.polyline([ll[i],ll[i+1]],{color:c,weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);}map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');let restStarted=false;stops.forEach(function(s,i){  if(i==0){const sec=document.createElement('div');sec.className='section';sec.textContent='Priority 3 - any order, before rest';ol.appendChild(sec);}  if(s.tier!='priority'&&!restStarted){restStarted=true;const sec=document.createElement('div');sec.className='section rest';sec.textContent='Rest - optimized';ol.appendChild(sec);}  const li=document.createElement('li');if(s.start)li.classList.add('start');  const cls='num '+(s.start?'start':s.tier);  const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';  const note=s.note?'<div class="note">'+s.note+'</div>':'';  const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';  li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';  li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});  ol.appendChild(li);});if(omit){const li=document.createElement('li');li.style.opacity='.7';  li.innerHTML='<div class="num" style="background:#9ca3af">X</div><div class="addr"><b>'+omit.addr+'</b><div class="note" style="background:#f3f4f6">'+omit.note+'</div></div>';  li.addEventListener('click',function(){map.setView([omit.lat,omit.lon],15);});ol.appendChild(li);}</script></body></html>
