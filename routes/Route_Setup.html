<!DOCTYPE html><html><head><meta charset="utf-8"><title>Setup Route</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#ea580c;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#ffedd5;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#ea580c}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db;display:flex;gap:6px;flex-wrap:wrap}.btns a{padding:6px 10px;background:#ea580c;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.btns a.alt{background:#6b7280}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#ffedd5}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.permit{display:inline-block;background:#ea580c;color:#fff;font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px;font-weight:700;font-family:Menlo,Consolas,monospace}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block;line-height:1.4}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{background:#ea580c;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}.marker-pin.start{background:#16a34a}.marker-pin.end{background:#dc2626}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Setup Route</h1><p>12 stops · fully optimized open path</p></div><div class="stats"><b>~42 min</b> driving · <b>~27.9 km</b><br><span style="color:#6b7280">Start: 700 Osborne St → End: 147 Newton Ave</span></div><div class="est">~ estimated (no live traffic — haversine × 1.39 @ 40 km/h)</div><div class="btns"><a href="https://www.google.com/maps/dir/49.862167,-97.131597/49.8806406,-97.1593856/49.885806,-97.1495237/49.894165,-97.160445/49.896366,-97.160985/49.931231,-97.164887/49.945863,-97.195006/49.95676,-97.18756/49.9586946,-97.142741/49.93773,-97.117383/49.94148,-97.1138874/49.942365,-97.109927" target="_blank">Open in Google Maps</a><a class="alt" href="https://www.google.com/maps/dir/49.862167,-97.131597/49.8806406,-97.1593856/49.885806,-97.1495237/49.894165,-97.160445/49.896366,-97.160985/49.931231,-97.164887/49.945863,-97.195006" target="_blank">Part 1</a><a class="alt" href="https://www.google.com/maps/dir/49.945863,-97.195006/49.95676,-97.18756/49.9586946,-97.142741/49.93773,-97.117383/49.94148,-97.1138874/49.942365,-97.109927" target="_blank">Part 2</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.862167, "lon": -97.131597, "addr": "700 Osborne St", "permit": "350572", "note": "1 Sidewalk", "label": "S", "start": true, "end": false}, {"lat": 49.8806406, "lon": -97.1593856, "addr": "63 Sherbrook St", "permit": "348134", "note": "1 Sidewalk \u00b7 BRING PLYWOOD for restaurant access", "label": "1", "start": false, "end": false}, {"lat": 49.885806, "lon": -97.1495237, "addr": "475 Broadway", "permit": "356629", "note": "1 Sidewalk", "label": "2", "start": false, "end": false}, {"lat": 49.894165, "lon": -97.160445, "addr": "510 Maryland St", "permit": "349375", "note": "1 Sidewalk", "label": "3", "start": false, "end": false}, {"lat": 49.896366, "lon": -97.160985, "addr": "640 Sargent Ave", "permit": "351454", "note": "1 Sidewalk", "label": "4", "start": false, "end": false}, {"lat": 49.931231, "lon": -97.164887, "addr": "1119 Mountain Ave", "permit": "337530", "note": "Street (barricades and loopers only)", "label": "5", "start": false, "end": false}, {"lat": 49.945863, "lon": -97.195006, "addr": "Inkster & Keewatin", "permit": "356693", "note": "Multiple Sidewalk + median", "label": "6", "start": false, "end": false}, {"lat": 49.95676, "lon": -97.18756, "addr": "51 Scarfe St", "permit": "356890", "note": "Driveway", "label": "7", "start": false, "end": false}, {"lat": 49.9586946, "lon": -97.142741, "addr": "2501 McPhillips St", "permit": "347870", "note": "Sidewalk", "label": "8", "start": false, "end": false}, {"lat": 49.93773, "lon": -97.117383, "addr": "1800 Main St", "permit": "351766", "note": "1 Sidewalk", "label": "9", "start": false, "end": false}, {"lat": 49.94148, "lon": -97.1138874, "addr": "Partridge & Main", "permit": "", "note": "Sidewalk", "label": "10", "start": false, "end": false}, {"lat": 49.942365, "lon": -97.109927, "addr": "147 Newton Ave", "permit": "356864", "note": "CHECK WITH RILEY FIRST", "label": "E", "start": false, "end": true}];const legs=[{"minutes": 6.0, "km": 3.98}, {"minutes": 1.9, "km": 1.27}, {"minutes": 2.5, "km": 1.69}, {"minutes": 0.5, "km": 0.34}, {"minutes": 8.1, "km": 5.4}, {"minutes": 5.6, "km": 3.75}, {"minutes": 2.8, "km": 1.84}, {"minutes": 6.7, "km": 4.47}, {"minutes": 6.2, "km": 4.11}, {"minutes": 1.0, "km": 0.68}, {"minutes": 0.6, "km": 0.42}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin';if(s.start)cls='marker-pin start';else if(s.end)cls='marker-pin end';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':s.end?'END':'Stop '+i)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#ea580c',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
