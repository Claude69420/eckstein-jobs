<!DOCTYPE html><html><head><meta charset="utf-8"><title>Route from Princess & William</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:450px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#0369a1;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e0f2fe;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#0369a1}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#0369a1;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#0369a1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#eff6ff;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Route from Princess &amp; William</h1><p>start + 4 stops - optimized, open end</p></div><div class="stats"><b>~32 min</b> driving - <b>~21.1 km</b><br><span style="color:#6b7280">Princess &amp; William -> 65 Lowson Cres / Sterling Lyon Pkwy</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.899577,-97.141319/49.893657,-97.117632/49.892487,-97.122171/49.910029,-97.190319/49.84116,-97.204351" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.899577, "lon": -97.141319, "addr": "Princess St & William Ave", "note": "START", "label": "1", "start": true, "end": false}, {"lat": 49.893657, "lon": -97.117632, "addr": "277 Provencher Blvd", "note": "2 sidewalk cuts", "label": "2", "start": false, "end": false}, {"lat": 49.892487, "lon": -97.122171, "addr": "185 Provencher Blvd", "note": "", "label": "3", "start": false, "end": false}, {"lat": 49.910029, "lon": -97.190319, "addr": "130 Midland St", "note": "", "label": "4", "start": false, "end": false}, {"lat": 49.84116, "lon": -97.204351, "addr": "65 Lowson Cres / Sterling Lyon Pkwy", "note": "", "label": "5", "start": false, "end": true}];const legs=[{"minutes": 3.8, "km": 2.53}, {"minutes": 0.7, "km": 0.49}, {"minutes": 11.0, "km": 7.31}, {"minutes": 16.1, "km": 10.74}];const map=L.map('map');var _bg=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,attribution:'Tiles &copy; Esri'}).addTo(map);try{_bg.getContainer().style.filter='brightness(0.9) contrast(1.2)';}catch(e){}L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#0369a1';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>Stop '+s.label+(s.start?' (start)':s.end?' (end)':'')+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#0369a1',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
