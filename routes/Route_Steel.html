<!DOCTYPE html><html><head><meta charset="utf-8"><title>Steel Route</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#475569;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e2e8f0;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#475569}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db;display:flex;gap:6px;flex-wrap:wrap}.btns a{padding:6px 10px;background:#475569;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.btns a.alt{background:#6b7280}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#e2e8f0}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#475569;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.permit{display:inline-block;background:#475569;color:#fff;font-size:11px;padding:2px 7px;border-radius:3px;margin-top:3px;font-weight:700;font-family:Menlo,Consolas,monospace}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block;line-height:1.4}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{background:#475569;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}.marker-pin.start{background:#16a34a}.marker-pin.end{background:#dc2626}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Steel Route</h1><p>10 stops · 161 Princess → Portage&Broadway → River&Osborne → Webb/Mountain + cuts subset</p></div><div class="stats"><b>~48 min</b> driving · <b>~32.2 km</b><br><span style="color:#6b7280">Start: 161 Princess St → End: 147 Newton Ave</span></div><div class="est">~ estimated (no live traffic — haversine × 1.39 @ 40 km/h)</div><div class="btns"><a href="https://www.google.com/maps/dir/49.9004098,-97.1407462/49.8866312,-97.1652393/49.879177,-97.14635/49.893109,-97.151563/49.892653,-97.215788/49.922088,-97.194688/49.945863,-97.195006/49.932744,-97.170132/49.931231,-97.164887/49.942365,-97.109927" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.9004098, "lon": -97.1407462, "addr": "161 Princess St", "permit": "", "note": "START \u00b7 steel pickup", "label": "S", "start": true, "end": false}, {"lat": 49.8866312, "lon": -97.1652393, "addr": "Portage & Broadway", "permit": "", "note": "", "label": "1", "start": false, "end": false}, {"lat": 49.879177, "lon": -97.14635, "addr": "River & Osborne", "permit": "", "note": "2 cuts + sidewalk \u00b7 LC + cuts", "label": "2", "start": false, "end": false}, {"lat": 49.893109, "lon": -97.151563, "addr": "447 Webb Pl", "permit": "357289", "note": "", "label": "3", "start": false, "end": false}, {"lat": 49.892653, "lon": -97.215788, "addr": "580 Roseberry St", "permit": "356947", "note": "", "label": "4", "start": false, "end": false}, {"lat": 49.922088, "lon": -97.194688, "addr": "331 Keewatin St", "permit": "356625", "note": "", "label": "5", "start": false, "end": false}, {"lat": 49.945863, "lon": -97.195006, "addr": "Inkster & Keewatin", "permit": "356693", "note": "", "label": "6", "start": false, "end": false}, {"lat": 49.932744, "lon": -97.170132, "addr": "1247 Mountain Ave", "permit": "356828", "note": "", "label": "7", "start": false, "end": false}, {"lat": 49.931231, "lon": -97.164887, "addr": "1119 Mountain Ave", "permit": "337530", "note": "", "label": "8", "start": false, "end": false}, {"lat": 49.942365, "lon": -97.109927, "addr": "147 Newton Ave", "permit": "356864", "note": "", "label": "E", "start": false, "end": true}];const legs=[{"minutes": 4.9, "km": 3.24}, {"minutes": 3.3, "km": 2.21}, {"minutes": 3.3, "km": 2.22}, {"minutes": 9.6, "km": 6.4}, {"minutes": 7.5, "km": 5.01}, {"minutes": 5.5, "km": 3.67}, {"minutes": 4.8, "km": 3.2}, {"minutes": 0.9, "km": 0.57}, {"minutes": 8.6, "km": 5.73}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin';if(s.start)cls='marker-pin start';else if(s.end)cls='marker-pin end';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':s.end?'END':'Stop '+i)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#475569',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
