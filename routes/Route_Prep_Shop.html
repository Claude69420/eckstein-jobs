<!DOCTYPE html><html><head><meta charset="utf-8"><title>Prep Route - Shop Loop</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#6d28d9;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#ede9fe;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#6d28d9}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#6d28d9;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#6d28d9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#f5f3ff;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Prep Route</h1><p>6 sites - loop from shop back to shop</p></div><div class="stats"><b>~64 min</b> driving - <b>~43.0 km</b><br><span style="color:#6b7280">Shop -> 6 sites -> Shop</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.840127,-97.254552/49.87908,-97.27716/49.906754,-97.194687/49.887043,-97.1572929/49.863262,-97.110002/49.8618847,-97.1094401/49.8553976,-97.1038908/49.840127,-97.254552" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.840127, "lon": -97.254552, "addr": "Shop (1279 Loudoun Rd)", "note": "START / END", "label": "S", "start": true, "end": false}, {"lat": 49.87908, "lon": -97.27716, "addr": "Portage Ave & Harris Blvd", "note": "1 sidewalk cut", "label": "1", "start": false, "end": false}, {"lat": 49.906754, "lon": -97.194687, "addr": "Saskatchewan Ave & Empress St", "note": "1 street cut", "label": "2", "start": false, "end": false}, {"lat": 49.887043, "lon": -97.1572929, "addr": "277 Furby St (Furby & Portage)", "note": "1 street cut + 1 sidewalk", "label": "3", "start": false, "end": false}, {"lat": 49.863262, "lon": -97.110002, "addr": "St Anne's Rd & Stranmillis/Clonard", "note": "4 sidewalk cuts (1 Stranmillis, 3 near Clonard)", "label": "4", "start": false, "end": false}, {"lat": 49.8618847, "lon": -97.1094401, "addr": "68 St Anne's Rd", "note": "1 sidewalk cut at bus stop", "label": "5", "start": false, "end": false}, {"lat": 49.8553976, "lon": -97.1038908, "addr": "St Anne's Rd & Fermor Ave", "note": "1 sidewalk cut, NE side of NB St Anne's (Superstore entrance)", "label": "6", "start": false, "end": false}, {"lat": 49.840127, "lon": -97.254552, "addr": "Shop (1279 Loudoun Rd)", "note": "START / END", "label": "S", "start": false, "end": true}];const legs=[{"minutes": 9.6, "km": 6.43}, {"minutes": 13.9, "km": 9.26}, {"minutes": 7.2, "km": 4.81}, {"minutes": 9.0, "km": 5.97}, {"minutes": 0.3, "km": 0.22}, {"minutes": 1.7, "km": 1.15}, {"minutes": 22.8, "km": 15.2}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#6d28d9';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START (Shop)':s.end?'END (Shop)':'Stop '+s.label)+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#6d28d9',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){if(s.end)return;const li=document.createElement('li');if(s.start)li.classList.add('start');let cls='num';if(s.start)cls='num start';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});var back=document.createElement('li');back.className='end';var bl=legs[legs.length-1];back.innerHTML='<div class="num end">S</div><div class="addr"><b>Return to Shop</b><div class="leg">+~'+bl.minutes+' min &middot; ~'+bl.km+' km</div></div>';back.addEventListener('click',function(){map.setView([stops[0].lat,stops[0].lon],14);markers[0].openPopup();});ol.appendChild(back);</script></body></html>
