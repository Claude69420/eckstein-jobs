<!DOCTYPE html><html><head><meta charset="utf-8"><title>Base Route - from Shop</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:450px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#0369a1;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e0f2fe;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#0369a1}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#0369a1;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#0369a1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#fef3c7;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Base Route</h1><p>4 sites from shop</p></div><div class="stats"><b>~46 min</b> driving - <b>~30.9 km</b><br><span style="color:#6b7280">Start: Shop -> End: 2049 Dugald Rd</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.840127,-97.254552/49.84116,-97.204351/49.892989,-97.160175/49.8560713,-97.0983628/49.886745,-97.028731" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.840127, "lon": -97.254552, "addr": "Shop (1279 Loudoun Rd)", "note": "START", "label": "S", "start": true, "end": false}, {"lat": 49.84116, "lon": -97.204351, "addr": "65 Lowson Cres", "note": "1 asphalt path cut", "label": "1", "start": false, "end": false}, {"lat": 49.892989, "lon": -97.160175, "addr": "Ellice Ave & Maryland St", "note": "lots of sidewalk + paving stone cuts", "label": "2", "start": false, "end": false}, {"lat": 49.8560713, "lon": -97.0983628, "addr": "133 Niakwa Rd", "note": "1 sidewalk cut (SE corner)", "label": "3", "start": false, "end": false}, {"lat": 49.886745, "lon": -97.028731, "addr": "2049 Dugald Rd", "note": "1 asphalt path cut (NW corner of intersection)", "label": "4", "start": false, "end": true}];const legs=[{"minutes": 7.5, "km": 5.01}, {"minutes": 13.7, "km": 9.14}, {"minutes": 12.6, "km": 8.39}, {"minutes": 12.6, "km": 8.4}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#0369a1';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START (Shop)':s.end?'END - Stop '+s.label:'Stop '+s.label)+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#0369a1',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[50,50]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
