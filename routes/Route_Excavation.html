<!DOCTYPE html><html><head><meta charset="utf-8"><title>Excavation Route</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:470px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#b45309;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#ffedd5;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#b45309}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#b45309;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}.pend{padding:10px 14px;background:#fff7ed;border-bottom:1px solid #fed7aa;font-size:12px;color:#9a3412}.pend b{color:#b45309}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#b45309;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#fff7ed;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Excavation Route</h1><p>9 sites - start 63 Sherbrook (AM), finish Provencher/Main</p></div><div class="stats"><b>~71 min</b> driving - <b>~47.5 km</b><br><span style="color:#6b7280">63 Sherbrook St -> Main St & York Ave</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.8806406,-97.1593856/49.887043,-97.1572929/49.84116,-97.204351/49.8560713,-97.0983628/49.8283116,-97.0496491/49.827569,-97.043755/49.886745,-97.028731/49.893657,-97.117632/49.8904368,-97.1356128" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.8806406, "lon": -97.1593856, "addr": "63 Sherbrook St", "note": "1 sidewalk - DO FIRST (AM), bring plywood", "label": "1", "start": true, "end": false}, {"lat": 49.887043, "lon": -97.1572929, "addr": "277 Furby St (Furby & Portage)", "note": "additional sidewalk (undermining)", "label": "2", "start": false, "end": false}, {"lat": 49.84116, "lon": -97.204351, "addr": "65 Lowson Cres", "note": "1 asphalt path cut", "label": "3", "start": false, "end": false}, {"lat": 49.8560713, "lon": -97.0983628, "addr": "133 Niakwa Rd", "note": "1 sidewalk cut", "label": "4", "start": false, "end": false}, {"lat": 49.8283116, "lon": -97.0496491, "addr": "Ward & Lagimodiere (2050 Ward)", "note": "sidewalk - SE corner of Ward & Lagimodiere (Grant/Crown)", "label": "5", "start": false, "end": false}, {"lat": 49.827569, "lon": -97.043755, "addr": "Des Hivernants", "note": "1 more sidewalk? CHECK FIRST", "label": "6", "start": false, "end": false}, {"lat": 49.886745, "lon": -97.028731, "addr": "2049 Dugald Rd", "note": "recut + break asphalt path (backhoe scraping)", "label": "7", "start": false, "end": false}, {"lat": 49.893657, "lon": -97.117632, "addr": "277 Provencher Blvd", "note": "sidewalk cuts - end of day, by Main St", "label": "8", "start": false, "end": false}, {"lat": 49.8904368, "lon": -97.1356128, "addr": "Main St & York Ave", "note": "street cut - LAST / 2nd-last, end of day", "label": "9", "start": false, "end": true}];const legs=[{"minutes": 1.5, "km": 1.01}, {"minutes": 12.8, "km": 8.5}, {"minutes": 16.2, "km": 10.81}, {"minutes": 9.7, "km": 6.48}, {"minutes": 0.9, "km": 0.6}, {"minutes": 13.9, "km": 9.27}, {"minutes": 13.4, "km": 8.92}, {"minutes": 2.8, "km": 1.86}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#b45309';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>Stop '+s.label+(s.start?' (start, AM)':s.end?' (end of day)':'')+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#b45309',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
