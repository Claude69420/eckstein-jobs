76, "addr": "115 Blenheim Ave", "permit": "353962", "note": "Work", "label": "5", "start": false, "end": false}, {"lat": 49.855503, "lon": -97.148899, "addr": "25 Station Pl", "permit": "356622 / M022406", "note": "Cuts for 2 panels \u00b7 2 barricades", "label": "6", "start": false, "end": false}, {"lat": 49.811041, "lon": -97.216269, "addr": "Fleetwood Rd & Royal Oak Dr", "permit": "312027", "note": "6 barricades \u00b7 do cuts for 2 sidewalks", "label": "7", "start": false, "end": false}, {"lat": 49.795862, "lon": -97.198129, "addr": "Centre St & Coopers Town Rd", "permit": "356878", "note": "Work", "label": "E", "start": false, "end": true}];const legs=[{"minutes": 6.2, "km": 3.07}, {"minutes": 6.8, "km": 2.38}, {"minutes": 3.9, "km": 0.88}, {"minutes": 9.3, "km": 4.29}, {"minutes": 14.8, "km": 6.2}, {"minutes": 11.8, "km": 4.87}, {"minutes": 16.6, "km": 8.9}, {"minutes": 7.1, "km": 4.52}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin';if(s.start||s.end)cls='marker-pin se';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[32,32],iconAnchor:[16,16],className:''});const popup='<b>'+(s.start?'START':s.end?'END':'Stop '+i)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#dc2626',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start||s.end)li.classList.add('start');let cls='num';if(s.start||s.end)cls='num se';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+'+legs[i-1].minutes+' min &middot; '+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
