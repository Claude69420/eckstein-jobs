ckground:#ecfeff;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Route from 200 Hillbrook</h1><p>6 stops - open route</p></div><div class="stats"><b>~66 min</b> driving - <b>~44.0 km</b><br><span style="color:#6b7280">Start: 200 Hillbrook Dr -> End: Shady Shores Dr E</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic - jobs span NW/W/SE/downtown</div><div class="btns"><a href="https://www.google.com/maps/dir/49.9583,-97.2172/49.8894,-97.3052/49.879,-97.3093/49.899,-97.1414/49.8996,-97.1413/49.8823,-97.0334/49.8844,-97.0315" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.9583, "lon": -97.2172, "addr": "200 Hillbrook Dr", "permit": "", "note": "START (NW - Amber Trails)", "label": "1", "start": true, "end": false}, {"lat": 49.8894, "lon": -97.3052, "addr": "374 Highcliff Bay", "permit": "3... (Harris)", "note": "far west - Crestview", "label": "2", "start": false, "end": false}, {"lat": 49.879, "lon": -97.3093, "addr": "225 Allard Ave", "permit": "357... (Harris)", "note": "far west - Westwood", "label": "3", "start": false, "end": false}, {"lat": 49.899, "lon": -97.1414, "addr": "123 Princess St", "permit": "357... (Harris)", "note": "Exchange District", "label": "4", "start": false, "end": false}, {"lat": 49.8996, "lon": -97.1413, "addr": "Princess St & William Ave", "permit": "", "note": "Exchange District", "label": "5", "start": false, "end": false}, {"lat": 49.8823, "lon": -97.0334, "addr": "Shady Shores Dr W", "permit": "", "note": "SE - Island Lakes", "label": "6", "start": false, "end": false}, {"lat": 49.8844, "lon": -97.0315, "addr": "Shady Shores Dr E", "permit": "", "note": "SE - Island Lakes", "label": "7", "start": false, "end": true}];const legs=[{"minutes": 20.7, "km": 13.79}, {"minutes": 2.5, "km": 1.66}, {"minutes": 25.5, "km": 17.0}, {"minutes": 0.1, "km": 0.09}, {"minutes": 16.6, "km": 11.07}, {"minutes": 0.6, "km": 0.38}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#0891b2';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>Stop '+s.label+(s.start?' (start)':s.end?' (end)':'')+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#0891b2',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
