.forEach(function(s,i){bounds.push([s.lat,s.lon]);const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+s.color+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const rn=s.round==0?'SHOP':('Round '+s.round);const popup='<b>Stop '+s.label+' - '+rn+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});const ll=stops.map(function(s){return [s.lat,s.lon];});for(let i=0;i<ll.length-1;i++){L.polyline([ll[i],ll[i+1]],{color:stops[i+1].color,weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);}map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');let curRound=-1;const rnames={0:'Shop',1:'Round 1 (any order)',2:'Round 2',3:'Round 3'};stops.forEach(function(s,i){  if(s.round!=curRound){curRound=s.round;const sec=document.createElement('div');sec.className='section';sec.style.background=s.color;sec.textContent=rnames[s.round];ol.appendChild(sec);}  const li=document.createElement('li');  const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';  const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';  li.innerHTML='<div class="num" style="background:'+s.color+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+leg+'</div>';  li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});  ol.appendChild(li);});</script></body></html>
