<!DOCTYPE html><html><head><meta charset="utf-8"><title>Base Route - Sherbrook to Shop</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:460px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#0369a1;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#e0f2fe;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#0369a1}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#0369a1;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#0369a1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#eff6ff;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Base Route</h1><p>8 stops - Sherbrook &amp; 1391 St James fixed, rest optimized, end at shop</p></div><div class="stats"><b>~82 min</b> driving - <b>~54.5 km</b><br><span style="color:#6b7280">63 Sherbrook -> ... -> Shop</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.8806,-97.1594/49.9069,-97.1985/49.8844,-97.0321/49.8573,-97.0557/49.8272,-97.0402/49.8276,-97.0438/49.8142,-97.1126/49.8401,-97.2546" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.8806, "lon": -97.1594, "addr": "63 Sherbrook St", "note": "", "label": "1", "start": true, "end": false}, {"lat": 49.9069, "lon": -97.1985, "addr": "1391 St James St", "note": "", "label": "2", "start": false, "end": false}, {"lat": 49.8844, "lon": -97.0321, "addr": "Shady Shores Dr E & Seaside", "note": "2 sidewalk", "label": "3", "start": false, "end": false}, {"lat": 49.8573, "lon": -97.0557, "addr": "38 Penrose St", "note": "pickup barricade + loopers", "label": "4", "start": false, "end": false}, {"lat": 49.8272, "lon": -97.0402, "addr": "Lagimodiere & Warde Ave (2050 Warde)", "note": "1 sidewalk", "label": "5", "start": false, "end": false}, {"lat": 49.8276, "lon": -97.0438, "addr": "Des Hivernants & Cinnamon Teal (S intersection)", "note": "1 sidewalk - south of the two (Cinnamon Teal not in map data, pinned on Des Hivernants Blvd)", "label": "6", "start": false, "end": false}, {"lat": 49.8142, "lon": -97.1126, "addr": "1924 St Mary's Rd", "note": "2 sidewalk", "label": "7", "start": false, "end": false}, {"lat": 49.8401, "lon": -97.2546, "addr": "Shop (1279 Loudoun Rd)", "note": "END", "label": "8", "start": false, "end": true}];const legs=[{"minutes": 8.4, "km": 5.63}, {"minutes": 25.4, "km": 16.93}, {"minutes": 7.2, "km": 4.8}, {"minutes": 7.4, "km": 4.9}, {"minutes": 0.5, "km": 0.36}, {"minutes": 10.7, "km": 7.17}, {"minutes": 22.1, "km": 14.71}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#0369a1';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>Stop '+s.label+(s.start?' (start)':s.end?' (SHOP)':'')+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#0369a1',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
