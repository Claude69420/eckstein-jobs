 "km": 2.1}, {"minutes": 12.6, "km": 4.7}, {"minutes": 5.3, "km": 2.75}, {"minutes": 17.9, "km": 11.73}];const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let cls='marker-pin';if(s.start)cls='marker-pin start';else if(s.end)cls='marker-pin end';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':s.end?'END':'Stop '+i)+'</b><br>'+s.addr+(s.permit?'<br><b>Permit:</b> '+s.permit:'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#166534',weight:4,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[40,40]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+'+legs[i-1].minutes+' min &middot; '+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+permit+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],15);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
