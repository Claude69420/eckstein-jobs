-pin end';const icon=L.divIcon({html:'<div class="'+cls+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START':s.end?'END':'Stop '+s.label)+'</b><br>'+s.addr+(s.city?', <i>'+s.city+'</i>':'')+(s.permit?'<br><b>Permit:</b> '+s.permit:'')+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#2563eb',weight:4,opacity:.7,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[50,50]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const city=s.city?' <span class="city">'+s.city+'</span>':'';const permit=s.permit?'<div><span class="permit">'+s.permit+'</span></div>':'';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+city+permit+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],13);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
