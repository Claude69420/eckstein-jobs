<!DOCTYPE html><html><head><meta charset="utf-8"><title>Setup Route - Shop to Emily & McDermot</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:450px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#ea580c;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#ffedd5;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#ea580c}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#ea580c;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.note{color:#374151;font-size:11px;margin-top:3px;background:#fff7ed;padding:3px 6px;border-radius:3px;display:inline-block}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>Setup Route</h1><p>shop + 6 stops - optimized, open end</p></div><div class="stats"><b>~48 min</b> driving - <b>~32.1 km</b><br><span style="color:#6b7280">Shop -> ... -> 508 Regent Ave W</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.8401,-97.2546/49.8848,-97.1737/49.9036,-97.1608/49.8805,-97.1418/49.8904,-97.1356/49.9083,-97.0836/49.8951,-97.0193" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.8401, "lon": -97.2546, "addr": "Shop (1279 Loudoun Rd)", "note": "START", "label": "S", "start": true, "end": false}, {"lat": 49.8848, "lon": -97.1737, "addr": "Portage Ave & Lipton St", "note": "", "label": "1", "start": false, "end": false}, {"lat": 49.9036, "lon": -97.1608, "addr": "Emily St & McDermot Ave", "note": "", "label": "2", "start": false, "end": false}, {"lat": 49.8805, "lon": -97.1418, "addr": "350 River Ave (Scott & River)", "note": "", "label": "3", "start": false, "end": false}, {"lat": 49.8904, "lon": -97.1356, "addr": "Main St & York Ave", "note": "", "label": "4", "start": false, "end": false}, {"lat": 49.9083, "lon": -97.0836, "addr": "821 Nottingham Ave", "note": "East Kildonan", "label": "5", "start": false, "end": false}, {"lat": 49.8951, "lon": -97.0193, "addr": "508 Regent Ave W", "note": "", "label": "6", "start": false, "end": true}];const legs=[{"minutes": 15.9, "km": 10.62}, {"minutes": 4.8, "km": 3.18}, {"minutes": 6.1, "km": 4.04}, {"minutes": 2.5, "km": 1.65}, {"minutes": 8.8, "km": 5.87}, {"minutes": 10.1, "km": 6.72}];const map=L.map('map');var _bg=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,attribution:'Tiles &copy; Esri'}).addTo(map);try{_bg.getContainer().style.filter='brightness(0.9) contrast(1.2)';}catch(e){}L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#ea580c';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>'+(s.start?'START (Shop)':s.end?'END - '+s.addr:'Stop '+s.label)+'</b><br>'+s.addr+(s.note&&!s.start&&!s.end?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#ea580c',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[45,45]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const note=s.note?'<div class="note">'+s.note+'</div>':'';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
