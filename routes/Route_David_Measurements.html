<!DOCTYPE html><html><head><meta charset="utf-8"><title>David - Measurements & Limits</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>html,body{margin:0;padding:0;height:100%;font-family:-apple-system,Segoe UI,Arial,sans-serif}#wrap{display:flex;height:100vh}#map{flex:1}@media(max-width:760px){#wrap{flex-direction:column}#map{flex:none;height:52vh}#side{width:100%!important;flex:1;min-height:0;border-left:0;border-top:1px solid #d0d4db}}#side{width:450px;background:#f4f5f7;overflow:auto;border-left:1px solid #d0d4db}.hdr{padding:14px 16px;background:#0891b2;color:#fff}.hdr h1{margin:0;font-size:16px}.hdr p{margin:4px 0 0;font-size:13px;opacity:.9}.stats{padding:12px 16px;background:#cffafe;border-bottom:1px solid #d0d4db;font-size:13px}.stats b{color:#0891b2}.btns{padding:10px 16px;background:#fff;border-bottom:1px solid #d0d4db}.btns a{padding:6px 10px;background:#0891b2;color:#fff;text-decoration:none;border-radius:5px;font-size:12px}.est{padding:8px 16px;background:#fef9c3;border-bottom:1px solid #d0d4db;font-size:11px;color:#854d0e}ol.stops{list-style:none;margin:0;padding:0}ol.stops li{padding:11px 14px;border-bottom:1px solid #e0e4eb;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}ol.stops li:hover{background:#fff}ol.stops li.start{background:#dcfce7}ol.stops li.end{background:#fee2e2}.num{flex:0 0 30px;height:30px;border-radius:15px;background:#0891b2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.num.start{background:#16a34a}.num.end{background:#dc2626}.addr{flex:1;line-height:1.35}.leg{color:#9ca3af;font-size:11px;margin-top:4px}.marker-pin{color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);border:2px solid #fff}</style></head><body><div id="wrap"><div id="map"></div><div id="side"><div class="hdr"><h1>David - Measurements &amp; Limits</h1><p>start Watt &amp; Munroe + 8 stops - optimized</p></div><div class="stats"><b>~24 min</b> driving - <b>~16.0 km</b><br><span style="color:#6b7280">Watt &amp; Munroe -> 1493 Ross Ave W</span></div><div class="est">~ estimated (haversine x 1.39 @ 40 km/h) - no live traffic</div><div class="btns"><a href="https://www.google.com/maps/dir/49.9177,-97.0979/49.9178,-97.0972/49.8996,-97.1413/49.899,-97.1414/49.8937,-97.1502/49.8857,-97.1704/49.9036,-97.1608/49.91,-97.1903/49.9169,-97.1883" target="_blank">Open in Google Maps</a></div><ol class="stops" id="stops"></ol></div></div><script>const stops=[{"lat": 49.9177, "lon": -97.0979, "addr": "Watt St & Munroe Ave", "note": "START", "label": "1", "start": true, "end": false}, {"lat": 49.9178, "lon": -97.0972, "addr": "505 Munroe Ave", "note": "", "label": "2", "start": false, "end": false}, {"lat": 49.8996, "lon": -97.1413, "addr": "Princess St & William Ave", "note": "", "label": "3", "start": false, "end": false}, {"lat": 49.899, "lon": -97.1414, "addr": "123 Princess St", "note": "", "label": "4", "start": false, "end": false}, {"lat": 49.8937, "lon": -97.1502, "addr": "Ellice Ave & Kennedy St", "note": "SW corner", "label": "5", "start": false, "end": false}, {"lat": 49.8857, "lon": -97.1704, "addr": "905 Portage Ave", "note": "", "label": "6", "start": false, "end": false}, {"lat": 49.9036, "lon": -97.1608, "addr": "Emily St & McDermot Ave", "note": "", "label": "7", "start": false, "end": false}, {"lat": 49.91, "lon": -97.1903, "addr": "130 Midland St", "note": "", "label": "8", "start": false, "end": false}, {"lat": 49.9169, "lon": -97.1883, "addr": "1493 Ross Ave W", "note": "", "label": "9", "start": false, "end": true}];const legs=[{"minutes": 0.1, "km": 0.07}, {"minutes": 7.8, "km": 5.21}, {"minutes": 0.1, "km": 0.09}, {"minutes": 1.8, "km": 1.2}, {"minutes": 3.5, "km": 2.36}, {"minutes": 4.4, "km": 2.93}, {"minutes": 4.6, "km": 3.1}, {"minutes": 1.6, "km": 1.08}];const map=L.map('map');var _bg=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16,attribution:'Tiles &copy; Esri'}).addTo(map);try{_bg.getContainer().style.filter='brightness(0.9) contrast(1.2)';}catch(e){}L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:16}).addTo(map);const bounds=[];const markers=[];stops.forEach(function(s,i){bounds.push([s.lat,s.lon]);let bg=s.start?'#16a34a':s.end?'#dc2626':'#0891b2';const icon=L.divIcon({html:'<div class="marker-pin" style="background:'+bg+'">'+s.label+'</div>',iconSize:[30,30],iconAnchor:[15,15],className:''});const popup='<b>Stop '+s.label+(s.start?' (start)':s.end?' (end)':'')+'</b><br>'+s.addr+(s.note?'<br><i>'+s.note+'</i>':'');const m=L.marker([s.lat,s.lon],{icon:icon}).addTo(map).bindPopup(popup);markers.push(m);});L.polyline(stops.map(function(s){return [s.lat,s.lon];}),{color:'#0891b2',weight:3,opacity:.75,dashArray:'8,6'}).addTo(map);map.fitBounds(bounds,{padding:[50,50]});const ol=document.getElementById('stops');stops.forEach(function(s,i){const li=document.createElement('li');if(s.start)li.classList.add('start');else if(s.end)li.classList.add('end');let cls='num';if(s.start)cls='num start';else if(s.end)cls='num end';const leg=(i>0&&i<=legs.length)?'<div class="leg">+~'+legs[i-1].minutes+' min &middot; ~'+legs[i-1].km+' km</div>':'';const note=s.note?'<div class="leg" style="color:#374151">'+s.note+'</div>':'';li.innerHTML='<div class="'+cls+'">'+s.label+'</div><div class="addr"><b>'+s.addr+'</b>'+note+leg+'</div>';li.addEventListener('click',function(){map.setView([s.lat,s.lon],14);markers[i].openPopup();});ol.appendChild(li);});</script></body></html>
